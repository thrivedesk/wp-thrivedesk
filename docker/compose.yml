# The ThriveDesk bench. One WordPress, one plugin, reachable at a real domain.
#
# Only caddy publishes ports. WordPress and MariaDB talk over the compose
# network, so nothing here collides with another project's database or web
# server.
#
# Paths are relative to this file, which sits one level below the plugin it
# mounts — this repository *is* the plugin, so the mount source is `..`.
name: thrivedesk

services:
  mariadb:
    # CI runs mariadb:10.11 (.github/workflows/phpunit.yml). This is the current
    # LTS instead, because the bench is where you develop rather than where you
    # certify. If you are chasing a failure that only CI sees, pin this to 10.11
    # and `./td reset` to rule the database out.
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
      # Creates the second database the PHPUnit suite needs, on first boot only.
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # WordPress starting before the database is ready is the classic first-boot
      # failure: the install runs, cannot connect, and leaves a half-made site.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wp
      args:
        WORDPRESS_IMAGE: ${TD_WP_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        /* Caddy terminates TLS, so PHP sees plain http and would otherwise
           build every URL as http:// and redirect-loop the admin. */
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define( 'WP_HOME', '${TD_SITE_URL:-https://thrivedesk.local}' );
        define( 'WP_SITEURL', '${TD_SITE_URL:-https://thrivedesk.local}' );

        /* Errors go to the log, never to the screen. A white page therefore
           means an uncaught throw, and the log names the file and line. */
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        @ini_set( 'display_errors', 0 );

        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'SCRIPT_DEBUG', false );
    volumes:
      # WordPress itself lives in a volume; only the plugin comes from disk, so
      # an edit in this repository is live with no copy step and no sync.
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/thrivedesk
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - wordpress
    # OrbStack resolves this name to the container and routes to it directly, so
    # the site answers on 443 without publishing a host port and without touching
    # /etc/hosts. Ignored by other runtimes, which use the published ports below.
    labels:
      dev.orbstack.domains: "thrivedesk.local"
    ports:
      - "${TD_BIND_IP:-127.0.0.1}:${TD_HTTP_PORT:-80}:80"
      - "${TD_BIND_IP:-127.0.0.1}:${TD_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The local certificate authority lives here. Losing this volume means
      # trusting a new CA, so it is named rather than anonymous.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  wp:
  caddy-data:
  caddy-config:
