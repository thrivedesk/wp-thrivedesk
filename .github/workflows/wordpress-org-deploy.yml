name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run production

      # wp.org requires readme.txt
      - name: Generate readme.txt for WordPress.org
        run: cp readme.md readme.txt

      - name: Verify the deploy package
        run: |
          dist="$(mktemp -d)"
          rsync -a --exclude-from=.distignore ./ "$dist/"
          if [ ! -f "$dist/vendor/autoload.php" ]; then
            echo "::error::vendor/autoload.php is missing from the deploy package — the plugin will fatal on load. Check .distignore and the Build step."
            exit 1
          fi
          echo "Autoloader present in package: OK"

          # Development tooling ships to nobody. Each of these is excluded in
          # .distignore already; this is what says so out loud when a new one
          # arrives without its entry, before wp.org publishes it to every site.
          strays="$(cd "$dist" && find . \( \
            -name '*.sh' -o -name 'compose*.yml' -o -name 'Dockerfile' \
            -o -name 'CLAUDE.md' -o -name 'phpcs*.xml' \
            -o -path './docker/*' -o -path './scripts/*' -o -path './resources/*' \
            -o -path './tests/*' -o -path './e2e/*' -o -path './.github/*' \
            \) -print)"
          if [ -n "$strays" ]; then
            echo "::error::development files reached the deploy package. Add them to .distignore:"
            echo "$strays"
            exit 1
          fi
          echo "No development files in package: OK"

      # Pinned to a commit SHA, not the mutable @stable tag: this step receives
      # the wp.org publishing credentials, and a moved tag would hand them to
      # code nobody here reviewed. Dependabot opens PRs to move the pin.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: thrivedesk

  release-notes:
    name: Publish release notes from changelog.txt
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Create or update release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/parse-changelog.js
