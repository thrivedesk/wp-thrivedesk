name: PHPCS

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# This job only reads the checkout, don't inherit the repo's default token scope.
permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs

      # Security sniffs run from their own ruleset with no path exclusions.
      # phpcs.xml excludes legacy paths while formatting is adopted
      # incrementally, and a rule-scoped exclude there also suppresses
      # WordPress.Security.* for those files - which are precisely the files
      # that read request input. See phpcs-security.xml.
      - name: Run PHPCS security sniffs
        run: composer phpcs-security

      # Same reasoning, for translations: the paths phpcs.xml excludes are the
      # ones that hold the strings. See phpcs-i18n.xml.
      - name: Run PHPCS i18n sniffs
        run: composer phpcs-i18n
