name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the plugin's declared floor (Requires PHP: 7.4).
        php: [ '7.4' ]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_VERSION: '7.0'
      WP_CORE_DIR: ${{ github.workspace }}/wp-core
      DB_HOST: 127.0.0.1
      DB_NAME: wordpress_test
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download WordPress core
        run: |
          mkdir -p "$WP_CORE_DIR"
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tar.gz
          tar -xzf /tmp/wp.tar.gz -C /tmp
          cp -r /tmp/wordpress/. "$WP_CORE_DIR/"

      - name: Write PHPUnit test config
        # Generates the wp-tests-config.php that the wp-phpunit bootstrap loads.
        run: |
          cat > "${{ github.workspace }}/wp-tests-config.php" <<PHP
          <?php
          define( 'ABSPATH', '${WP_CORE_DIR}/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'DB_NAME', '${DB_NAME}' );
          define( 'DB_USER', '${DB_USER}' );
          define( 'DB_PASSWORD', '${DB_PASSWORD}' );
          define( 'DB_HOST', '${DB_HOST}' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          \$table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'ThriveDesk Tests' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'WPLANG', '' );
          PHP

      - name: Run PHPUnit
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/wp-tests-config.php
        run: vendor/bin/phpunit

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs
