name: "Scripts"

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts.yml'
      - 'changelog.txt'
  pull_request:
    branches: [ develop ]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts.yml'
      - 'changelog.txt'

# This job only reads the checkout, don't inherit the repo's default token scope.
permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run tests
        run: node --test .github/scripts/parse-changelog.test.js
