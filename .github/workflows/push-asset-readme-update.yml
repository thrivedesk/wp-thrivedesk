name: Plugin asset/readme update

on:
  push:
    branches:
      - develop
    paths:
      - "readme.txt"
      - "readme.md"
      - ".wordpress-org/**"
  workflow_dispatch:

permissions:
  contents: read

# Serialize SVN-mutating runs so a fast push and a manual run can't race.
concurrency:
  group: wporg-assets
  cancel-in-progress: false

jobs:
  assets:
    name: Update assets and readme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # wp.org requires readme.txt
      - name: Generate readme.txt for WordPress.org
        run: cp readme.md readme.txt

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: thrivedesk
          # only sync readme + assets, code (and the built vendor/) ships via the tag deploy workflow
          IGNORE_OTHER_FILES: true
