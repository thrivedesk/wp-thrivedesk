name: Release Notes

# This repo has no release branch: develop is the only long-lived branch and
# a release IS the v* tag push (wordpress-org-deploy.yml keys off the same
# pattern). So the release summary is built here from the tag range instead
# of a release PR: every PR merged into develop between the previous tag and
# this one, published as the GitHub Release body and announced on Discord.

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write
  pull-requests: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag range
        id: range
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$current" | head -1 || true)"
          echo "current=$current"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Publish release summary
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CURRENT_TAG: ${{ steps.range.outputs.current }}
          PREVIOUS_TAG: ${{ steps.range.outputs.previous }}
        with:
          script: |
            const currentTag  = process.env.CURRENT_TAG;
            const previousTag = process.env.PREVIOUS_TAG;

            // Commits in this release: previous tag → this tag. A first
            // release has no previous tag, so fall back to the tag's history.
            let commits;
            if (previousTag) {
              commits = await github.paginate(github.rest.repos.compareCommitsWithBasehead, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${previousTag}...${currentTag}`,
                per_page: 100,
              });
            } else {
              commits = await github.paginate(github.rest.repos.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: currentTag,
                per_page: 100,
              });
            }

            // Collect the PRs (merged into develop) and contributors behind
            // those commits.
            const merged       = new Map();
            const contributors = new Map(); // login → { login, name }

            for (const commit of commits) {
              if (commit.author?.login) {
                contributors.set(commit.author.login, {
                  login: commit.author.login,
                  name:  commit.commit?.author?.name ?? commit.author.login,
                });
              }

              const { data: assoc } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commit.sha,
              });

              for (const pr of assoc) {
                if (pr.merged_at) {
                  merged.set(pr.number, pr);
                  if (pr.user?.login) {
                    contributors.set(pr.user.login, {
                      login: pr.user.login,
                      name:  pr.user.login,
                    });
                  }
                }
              }
            }

            const sortedPRs = [...merged.values()].sort((a, b) => a.number - b.number);

            // Group by type prefix (feat/fix/chore/refactor/etc.)
            const groups = {};
            for (const pr of sortedPRs) {
              const match = pr.title.match(/^(\w+)(\(.+\))?[!:]?/);
              const type  = match ? match[1].toLowerCase() : 'other';
              if (!groups[type]) groups[type] = [];
              groups[type].push(pr);
            }

            const typeEmoji = {
              feat:     '✨ Features',
              fix:      '🐛 Bug Fixes',
              chore:    '🔧 Chores',
              refactor: '♻️ Refactors',
              docs:     '📝 Docs',
              test:     '🧪 Tests',
              perf:     '⚡ Performance',
              ci:       '👷 CI',
              style:    '💄 Style',
            };

            const prSection = Object.entries(groups).map(([type, prs]) => {
              const heading = typeEmoji[type] ?? `📦 ${type.charAt(0).toUpperCase() + type.slice(1)}`;
              const lines   = prs.map(pr => `- ${pr.title} (#${pr.number})`).join('\n');
              return `### ${heading}\n${lines}`;
            }).join('\n\n');

            const contributorList = [...contributors.values()]
              .map(c => `<a href="https://github.com/${c.login}"><img src="https://wsrv.nl/?url=github.com/${c.login}.png%3Fsize%3D48&w=48&h=48&shape=circle" width="48" height="48" alt="${c.login}" title="${c.login}"/></a>`)
              .join(' ');

            const typeBreakdown = Object.entries(groups)
              .map(([type, prs]) => `${type}: ${prs.length}`)
              .join(' · ');

            const rangeLabel = previousTag ? `**${previousTag}** → **${currentTag}**` : `**${currentTag}**`;

            const body = [
              '## 📦 Release Summary',
              '',
              `> ${rangeLabel} · ${sortedPRs.length} PRs merged on develop · ${typeBreakdown || 'no typed PRs'}`,
              '',
              '---',
              '',
              prSection || '_No merged PRs found in this range._',
              '',
              '---',
              '',
              '### 👥 Contributors',
              contributorList || '_None detected._',
              '',
              '### 📊 Stats',
              `| Commits | PRs merged |`,
              `|---------|-----------|`,
              `| ${commits.length} | ${sortedPRs.length} |`,
              '',
              `---`,
              `_Generated: ${new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dhaka', hour12: true })} (Dhaka)_`,
            ].join('\n');

            // Attach the summary to the GitHub Release for this tag,
            // creating it when the tag was pushed without one.
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: currentTag,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body,
              });
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: currentTag,
                name: currentTag,
                body,
              }));
            }

            // Discord announcement
            const discordPRs = sortedPRs.map(pr => `• ${pr.title} — [#${pr.number}](${pr.html_url})`).join('\n');

            const embed = {
              author: {
                name: '🔌 WordPress Plugin',
              },
              title:       `🚀 ${currentTag} is live`,
              url:         release.html_url,
              description: discordPRs || '_No merged PRs found in this range._',
              color:       0x1A63E8,
              fields: [
                { name: 'PRs merged', value: String(sortedPRs.length), inline: true },
                { name: 'Commits',    value: String(commits.length),   inline: true },
                { name: 'Range',      value: previousTag ? `${previousTag} → ${currentTag}` : currentTag, inline: true },
              ],
              footer: { text: `${currentTag} · ThriveDesk` },
              timestamp: new Date().toISOString(),
            };

            await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ embeds: [embed] }),
            });
