name: Announce Release

# This repo has no release branch: develop is the only long-lived branch and a
# release IS the v* tag push.
#
# The GitHub Release body is NOT written here. wordpress-org-deploy.yml owns it,
# via .github/scripts/parse-changelog.js, so the release reads exactly like the
# changelog wordpress.org users see. Both workflows fire on the same tag, so
# writing the body from both would race and the winner would be whichever job
# happened to finish last. This one announces to Discord and nothing else, and
# derives its summary from the PRs merged between the previous tag and this one.

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read
  pull-requests: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag range
        id: range
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"

          # The release before this one is the nearest tag reachable from the
          # tagged commit's parent, not simply the highest tag that isn't this
          # one - tagging a patch on an older line (v2.5.1 while v2.6.0 exists)
          # would otherwise resolve to a newer tag and invert the range.
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${current}^" 2>/dev/null || true)"

          echo "current=$current"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Range: ${previous:-<first release>} -> $current"

      - name: Announce on Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CURRENT_TAG: ${{ steps.range.outputs.current }}
          PREVIOUS_TAG: ${{ steps.range.outputs.previous }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('DISCORD_WEBHOOK_URL is not set; nothing to announce to.');
              return;
            }

            const currentTag  = process.env.CURRENT_TAG;
            const previousTag = process.env.PREVIOUS_TAG;
            const { owner, repo } = context.repo;

            // compareCommitsWithBasehead answers with a single comparison
            // object, not a list, and paginate only unwraps responses carrying
            // total_count. Without the mapFn it yields [comparison] - one
            // element with no .sha - and every commit lookup below 422s.
            let commits;
            if (previousTag) {
              commits = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner, repo, basehead: `${previousTag}...${currentTag}`, per_page: 100 },
                (response) => response.data.commits,
              );
            } else {
              commits = await github.paginate(github.rest.repos.listCommits, {
                owner, repo, sha: currentTag, per_page: 100,
              });
            }

            const merged       = new Map();
            const contributors = new Set();

            for (const commit of commits) {
              if (commit.author?.login) {
                contributors.add(commit.author.login);
              }

              const { data: assoc } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: commit.sha,
              });

              for (const pr of assoc) {
                if (pr.merged_at) {
                  merged.set(pr.number, pr);
                  if (pr.user?.login) contributors.add(pr.user.login);
                }
              }
            }

            const sortedPRs = [...merged.values()].sort((a, b) => a.number - b.number);

            // Discord caps an embed description at 4096 characters and a field
            // value at 1024. Drop the overflow explicitly rather than letting
            // the webhook 400 on an oversized payload.
            const clamp = (lines, limit, noun) => {
              const kept = [];
              let size = 0;

              for (const line of lines) {
                if (size + line.length + 1 > limit) {
                  const dropped = lines.length - kept.length;
                  core.warning(`${dropped} ${noun} omitted from the announcement (Discord size limit)`);
                  kept.push(`_...and ${dropped} more_`);
                  break;
                }
                kept.push(line);
                size += line.length + 1;
              }

              return kept.join('\n');
            };

            const description = clamp(
              sortedPRs.map(pr => `• ${pr.title} — [#${pr.number}](${pr.html_url})`),
              3900,
              'PRs',
            ) || '_No merged PRs found in this range._';

            // Valid whether or not parse-changelog.js has created the release
            // object yet - GitHub serves the tag at this path either way.
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${currentTag}`;

            const embed = {
              author:      { name: '🔌 WordPress Plugin' },
              title:       `🚀 ${currentTag} is live`,
              url:         releaseUrl,
              description,
              color:       0x1A63E8,
              fields: [
                { name: 'PRs merged', value: String(sortedPRs.length), inline: true },
                { name: 'Commits',    value: String(commits.length),   inline: true },
                { name: 'Range',      value: previousTag ? `${previousTag} → ${currentTag}` : currentTag, inline: true },
              ],
              footer:    { text: `${currentTag} · ThriveDesk` },
              timestamp: new Date().toISOString(),
            };

            if (contributors.size) {
              embed.fields.push({
                name:  'Contributors',
                value: clamp([...contributors].sort().map(l => `@${l}`), 1000, 'contributors').replace(/\n/g, ', '),
              });
            }

            const response = await fetch(webhook, {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ embeds: [embed] }),
            });

            // fetch only rejects on a transport error, so a rejected webhook
            // would otherwise pass silently and the release would look announced.
            if (!response.ok) {
              core.setFailed(
                `Discord rejected the announcement: ${response.status} ${await response.text()}`,
              );
              return;
            }

            core.info(`Announced ${currentTag}: ${sortedPRs.length} PRs, ${commits.length} commits.`);
