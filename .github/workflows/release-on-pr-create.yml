name: Release PR Update

# develop is this repo's only long-lived branch (releases ship from v* tags),
# so release PRs target develop and the release: title gate below keeps
# ordinary feature PRs from triggering this.
on:
  pull_request:
    types: [ opened, synchronize, edited, closed ]
    branches:
      - develop

jobs:
  release-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update PR Description
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const prNumber     = context.payload.pull_request.number;
            const commitCount  = context.payload.pull_request.commits;
            const filesChanged = context.payload.pull_request.changed_files;
            const additions    = context.payload.pull_request.additions;
            const deletions    = context.payload.pull_request.deletions;
            const baseBranch   = context.payload.pull_request.base.ref;
            const headBranch   = context.payload.pull_request.head.ref;

            // Collect commits in this release PR
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // Collect merged PRs and contributors from commits
            const merged       = new Map();
            const contributors = new Map(); // login → { login, name }

            for (const commit of commits) {
              if (commit.author?.login) {
                contributors.set(commit.author.login, {
                  login: commit.author.login,
                  name:  commit.commit.author?.name ?? commit.author.login,
                });
              }

              const { data: assoc } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commit.sha,
              });

              for (const pr of assoc) {
                if (pr.number !== prNumber && pr.merged_at) {
                  merged.set(pr.number, pr);
                  if (pr.user?.login) {
                    contributors.set(pr.user.login, {
                      login: pr.user.login,
                      name:  pr.user.login,
                    });
                  }
                }
              }
            }

            const sortedPRs = [...merged.values()].sort((a, b) => a.number - b.number);

            // Group by type prefix (feat/fix/chore/refactor/etc.)
            const groups = {};
            for (const pr of sortedPRs) {
              const match = pr.title.match(/^(\w+)(\(.+\))?[!:]?/);
              const type  = match ? match[1].toLowerCase() : 'other';
              if (!groups[type]) groups[type] = [];
              groups[type].push(pr);
            }

            const typeEmoji = {
              feat:     '✨ Features',
              fix:      '🐛 Bug Fixes',
              chore:    '🔧 Chores',
              refactor: '♻️ Refactors',
              docs:     '📝 Docs',
              test:     '🧪 Tests',
              perf:     '⚡ Performance',
              ci:       '👷 CI',
              style:    '💄 Style',
            };

            const prSection = Object.entries(groups).map(([type, prs]) => {
              const heading = typeEmoji[type] ?? `📦 ${type.charAt(0).toUpperCase() + type.slice(1)}`;
              const lines   = prs.map(pr => `- #${pr.number}`).join('\n');
              return `### ${heading}\n${lines}`;
            }).join('\n\n');

            const contributorList = [...contributors.values()]
              .map(c => `<a href="https://github.com/${c.login}"><img src="https://wsrv.nl/?url=github.com/${c.login}.png%3Fsize%3D48&w=48&h=48&shape=circle" width="48" height="48" alt="${c.login}" title="${c.login}"/></a>`)
              .join(' ');

            const typeBreakdown = Object.entries(groups)
              .map(([type, prs]) => `${type}: ${prs.length}`)
              .join(' · ');

            const body = [
              '## 📦 Release Summary',
              '',
              `> Merging **${headBranch}** → **${baseBranch}** · ${sortedPRs.length} PRs · ${typeBreakdown}`,
              '',
              '---',
              '',
              prSection || '_No merged PRs found._',
              '',
              '---',
              '',
              '### 👥 Contributors',
              contributorList || '_None detected._',
              '',
              '### 📊 Stats',
              `| Commits | Files changed | Additions | Deletions |`,
              `|---------|--------------|-----------|-----------|`,
              `| ${commitCount} | ${filesChanged} | +${additions} | -${deletions} |`,
              '',
              `---`,
              `_Last updated: ${new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dhaka', hour12: true })} (Dhaka)_`,
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body,
            });

            // Only notify Discord on merge
            if (!context.payload.pull_request.merged) return;

            // Build Discord embed
            const prUrl       = context.payload.pull_request.html_url;
            const discordPRs  = sortedPRs.map(pr => `• ${pr.title} — [#${pr.number}](${pr.html_url})`).join('\n');

            const embed = {
              author: {
                name: '🔌 WordPress Plugin',
              },
              title:       '🚀 New release is live',
              url:         prUrl,
              description: discordPRs || '_No merged PRs found._',
              color:       0x1A63E8,
              fields: [
                { name: 'PRs merged',    value: String(sortedPRs.length), inline: true },
                { name: 'Files changed', value: String(filesChanged),     inline: true },
                { name: 'Changes',       value: `+${additions} / -${deletions}`, inline: true },
              ],
              footer: { text: `#${prNumber} · ThriveDesk` },
              timestamp: new Date().toISOString(),
            };

            await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ embeds: [embed] }),
            });
