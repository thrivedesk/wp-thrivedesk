version: 2

updates:
  # Workflow actions are pinned to commit SHAs so a moved tag cannot swap the
  # code that handles the wp.org publishing credentials. Pins only stay current
  # if something opens PRs to move them, which is what this entry is for.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
